services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: bilibili-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: ${TZ}
    networks:
      - bilibili-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: bilibili-kafka
    user: root
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: ${TZ}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bilibili-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: bilibili-scraper
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      BATCH_SIZE: ${BATCH_SIZE}
      LOG_LEVEL: ${LOG_LEVEL}
      DEFAULT_MIN_DELAY: ${DEFAULT_MIN_DELAY}
      DEFAULT_MAX_DELAY: ${DEFAULT_MAX_DELAY}
      TZ: ${TZ}
    volumes:
      - ./scraper/logs:/app/logs
    networks:
      - bilibili-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bilibili-backend
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      BATCH_SIZE: ${BATCH_SIZE}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    networks:
      - bilibili-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bilibili-frontend
    environment:
      TZ: ${TZ}
    networks:
      - bilibili-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: bilibili-admin
    environment:
      TZ: ${TZ}
    networks:
      - bilibili-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: bilibili-nginx
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - backend
      - frontend
      - admin
      - scraper
    environment:
      TZ: ${TZ}
    networks:
      - bilibili-network
    restart: unless-stopped

networks:
  bilibili-network:
    driver: bridge

volumes:
  clickhouse_data:
  kafka_data: